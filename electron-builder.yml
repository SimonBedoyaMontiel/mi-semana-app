appId: app.misemana.desktop
productName: Mi Semana
copyright: Mi Semana
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asar: true
compression: maximum
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  executableName: MiSemana
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Mi Semana
  artifactName: MiSemana-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
protocols:
  - name: Mi Semana
    schemes: [misemana]
# Auto-updates read the GitHub Releases of this repo (latest.yml + installer).
publish:
  provider: github
  owner: SimonBedoyaMontiel
  repo: mi-semana-app
  releaseType: release
electronLanguages:
  - es
  - es-419
  - en-US
